# IdCards. /idcard reload applies everything here.

language: en                      # plugins/IdCards/lang/<language>.yml

card:
  one-per-player: true            # true: issuing a new card makes the owner's older cards invalid (scanners deny them)
  self-service:
    enabled: false                # /idcard get for players with idcard.self
    cooldown-seconds: 300
  give-on-join: false             # hand everyone without a valid card of their own a new one when they join
  allow-drop: true                # false: cards cannot be dropped with Q or dragged out of the inventory
  on-death: keep                  # keep (stays in the inventory) | drop (like any item) | destroy
  allow-containers: true          # false: cards cannot be put into chests, barrels, shulker boxes, hoppers ...

present:                          # holding the card out (right mouse button held)
  cooldown-ticks: 10              # between two starts by the same player
  render-distance: 32             # how far away the held-out card is drawn

scanner:
  cooldown-ticks: 20              # after a scan has finished
  swipe-ticks: 14                 # the card sliding through the slot
  result-ticks: 40                # how long the green or red light stays
  present-range: 2.5              # how close a player holding the card out must stand for the scanner to read it
  volume: 1.0

computer:
  screen-timeout-seconds: 15      # back to the idle screen after this long; 0 = keep the last scan
  time-format: "HH:mm:ss"         # java.time pattern
  time-zone: ""                   # e.g. Europe/Helsinki; empty = the server's
  log:
    size: 60                      # scans kept per computer
    page-size: 8                  # scans per dialog page (1-12)
  auto-link:
    enabled: false                # a newly placed scanner or computer links to every counterpart within the radius
    radius: 8

blocks:
  break-hits: 4                   # left clicks a survival player needs to knock a scanner or computer off
  break-window-ticks: 30          # each hit must follow the one before within this time
  validate-interval-ticks: 100    # how often every loaded block is checked (support, barrier, entities)
  view-range: 1.0                 # display entity view range multiplier

luckperms:
  fallback-prefix: "&7Personnel"  # shown when LuckPerms is missing or the player has no prefix; & codes, hex, MiniMessage colours
  refresh-seconds: 60             # cached prefixes older than this are asked again (LuckPerms' change events refresh at once)

pack:
  delivery: auto                  # auto | same-port | http | url | none. See README "Hosting the pack".
  required: false                 # true: the vanilla "this server requires a resource pack" prompt (declining then disconnects)
  prompt: ""                      # MiniMessage text for the prompt; empty = vanilla text
  send-delay-ticks: 20            # after joining
  public-host: ""                 # the address players reach this server at; empty = the one each player typed
  http:                           # delivery http
    bind: 0.0.0.0
    port: 8166
  url: ""                         # delivery url: where you uploaded plugins/IdCards/idcards-pack.zip
  sha1: ""                        # delivery url: its SHA-1; empty = the one of the zip this plugin built

nametags:
  hide: false                     # true: name tags above heads are hidden for everyone (team idc_hidden), identity is on the card
